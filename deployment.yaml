
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mywebsite-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mywebsite

  template:
    metadata:
      labels:
        app: mywebsite

    spec:
      containers:
        - name: mywebsite
          image: 757957162256.dkr.ecr.ap-south-1.amazonaws.com/mywebsite-ecr:v1
          ports:
            - containerPort: 80
          imagePullPolicy: Always
